[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tanuki"
version = "0.1.0"
authors = [
  { name="Fabian Velosa", email="afvelosas@gmail.com" },
]
description = "A declarative DSL for procedural geometry that compiles to Blender Geometry Nodes and other backends."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/egxn/tanuki"
Issues = "https://github.com/egxn/tanuki/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Blender installed",
]
