<!doctype html><html><head><meta charset="utf-8">
<title>Stencil Lab</title>
<style>
 body{font:14px system-ui,sans-serif;margin:0;display:flex;height:100vh;color:#222}
 #panel{width:310px;padding:16px;overflow:auto;background:#f4f4f5;box-sizing:border-box}
 #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#ddd;overflow:auto}
 #holder{transition:zoom .05s} #stage svg{background:#fff;box-shadow:0 2px 12px #0003}
 label{display:block;margin:10px 0 2px;font-weight:600}
 input,select,button{width:100%;box-sizing:border-box}
 .row{display:flex;gap:8px}.row>*{flex:1}
 #layers .lyrow{display:flex;align-items:center;gap:6px;font-weight:400;margin:3px 0}
 #layers .lyrow input{width:auto}
 #layers .isl{margin-left:auto;display:flex;align-items:center;gap:2px;color:#b00;cursor:pointer}
 .sw{width:12px;height:12px;border:1px solid #999;display:inline-block}
 #linegrp{padding:4px 8px 8px;margin-top:6px;background:#ececee;border-radius:6px}
 fieldset.grp{border:1px solid #ddd;border-radius:6px;margin:12px 0;padding:4px 8px 8px}
 fieldset.grp legend{font-weight:700;font-size:12px;color:#555;padding:0 4px}
 #verdict{margin-top:10px;padding:8px;border-radius:6px;font-weight:600}
 .ok{background:#d6f5d6}.warn{background:#fdf0d0}.bad{background:#fde0e0}
 button{margin-top:6px;padding:8px;cursor:pointer}
 button.on{background:#e23;color:#fff;border-color:#a11}
 small{color:#666;font-weight:400}
 #zoombar{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:5}
 #zoombar button{width:34px;margin:0;padding:4px;font-weight:700}
 #busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
   background:#ddddddaa;z-index:8;font-weight:600}
 #sheets{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;display:none;
   background:#fffefee6;border:1px solid #ccc;border-radius:6px;padding:8px 10px;
   box-shadow:0 2px 12px #0002;font-size:12px}
 #sheets b{font-weight:700}
 #sheetgrid{display:grid;gap:2px;margin-top:6px;background:#aaa;border:1px solid #888}
 #sheetgrid .cell{background:#eaf1ff;display:flex;align-items:center;
   justify-content:center;font-size:9px;color:#5570a8;min-width:0;min-height:0}
 .spin{width:22px;height:22px;border:3px solid #999;border-top-color:#333;border-radius:50%;
   display:inline-block;margin-right:8px;animation:r .8s linear infinite;vertical-align:middle}
 @keyframes r{to{transform:rotate(360deg)}}
</style></head><body>
<div id="panel">
 <h3>Stencil Lab</h3>
 <input type="file" id="file" accept="image/*"
   title="Upload a photo (jpg/png/tiff). It is downscaled to a working size before screening.">
 <label title="How the image is split into ink plates.">Separation</label>
 <select id="method"
   title="Ink plates: grayscale (1 black), cmyk (process colour), rgb, duotone (2-ink riso), tritone (3-ink)."></select>
 <label title="The screen that turns ink coverage into vector geometry.">Pattern</label>
 <select id="pattern"
   title="The screen geometry. 'Recommended' patterns cut cleanly; 'Experimental' ones work best with Carrier mode on."></select>
 <label title="One-click recipes from the docs.">Preset <small>(reproduce the doc refs)</small></label>
 <select id="preset"
   title="One-click recipes that reproduce the street-art line-screen references (sets method, pattern, angle, max duty and wave)."></select>
 <label title="Screen rotation.">Screen angle <small>(auto = per-plate, anti-moiré)</small></label>
 <select id="angle"
   title="Screen rotation. 'auto' uses anti-moiré per-plate angles (15/75/0/45° for CMYK); pick 0° for the horizontal street-art line look.">
   <option value="auto">auto (per-plate)</option>
   <option value="0">0°</option><option value="15">15°</option>
   <option value="30">30°</option><option value="45">45°</option>
   <option value="60">60°</option><option value="75">75°</option>
   <option value="90">90°</option></select>
 <div id="linegrp" title="Extra knobs that only apply to the line_screen pattern.">
   <small>line_screen</small>
   <label title="Max line thickness as a fraction of the period.">Max duty <small id="mdv"></small></label>
   <input type="range" id="max_duty" min="0.3" max="1" value="1" step="0.05"
     title="Max line thickness as a fraction of the period. Under 1 leaves a sliver of material between lines so the screen self-bridges (more cuttable).">
   <div class="row">
     <div><label title="Sideways line undulation.">Wave amp (px)</label>
       <input type="number" id="wave_amplitude" value="0" min="0" step="1"
         title="How far (px) the lines undulate sideways. 0 = straight lines (ref 3); raise it for the wavy look (ref 5)."></div>
     <div><label title="Undulation period.">Wave len (px)</label>
       <input type="number" id="wave_length" value="0" min="0" step="1"
         title="The period (px) of the line undulation. Only used when Wave amp is above 0."></div>
   </div>
 </div>
 <label title="Pattern pitch in pixels — relative to the working image size.">Cell / period <small id="cellv"></small></label>
 <input type="range" id="cell" min="3" max="24" value="6" step="1"
   title="Pattern pitch in pixels (dot spacing / line period). Bigger = coarser and more cuttable; smaller = finer and more fragile. It is relative to the (downscaled) image, so a bigger image needs a bigger cell for the same look.">
 <div class="row"><div><label title="Tone contrast before screening.">Contrast</label>
   <input type="range" id="contrast" min="0.5" max="2.5" value="1" step="0.1"
     title="Tone contrast applied before screening. Above 1 boosts contrast, below 1 flattens it (1 = unchanged)."></div>
 <div><label title="Tone gamma before screening.">Gamma</label>
   <input type="range" id="gamma" min="0.3" max="2.5" value="1" step="0.1"
     title="Tone gamma applied before screening. Below 1 brightens midtones, above 1 darkens them (1 = unchanged)."></div></div>
 <label title="Swap dark and light (negative) before screening."><input type="checkbox" id="invert" style="width:auto"> Invert</label>

 <fieldset class="grp"><legend>Cutting</legend>
 <label title="Make it physically cuttable before export."><input type="checkbox" id="optimize" checked style="width:auto"> Optimize for cutting
   <small>(preview shows the real cut)</small></label>
 <label title="Per-pattern cut prep (needs Optimize): line screens are left exactly as drawn, while dots/hexagons have their touching shapes merged into one clean cut mass (isolated shapes kept). Off = the current behaviour."><input type="checkbox" id="group_blobs" style="width:auto"> Group touching shapes
   <small>(merge masses; lines untouched)</small></label>
 <label title="Lays a regular mesh over the design — like a metal grid or a die over leather: a connected lattice of material with a hole at every pattern cell, the cut confined to the holes so a material wall always survives between cells. The whole plate stays one piece and nothing falls out. For dots & hexagon screens. Off = the current behaviour."><input type="checkbox" id="support" style="width:auto"> Force support grid (mesh)
   <small>(dots/hex — holds every piece)</small></label>
 <label title="Width of the material walls between the mesh holes.">Mesh wall <small id="swv"></small></label>
 <input type="range" id="support_width" min="1" max="4" value="2" step="1"
   title="Width in pixels of the mesh walls (the supports between holes). Bigger = stronger walls and smaller holes; capped under the cell. Only used when Force support grid is on (dots / hexagons).">
 <label title="Overlay the support mesh (the lattice of cut openings) in cyan, to check it is working: the cut should sit inside the holes with a wall between cells. For dots & hexagons."><input type="checkbox" id="debug" style="width:auto"> Debug: show mesh
   <small>(overlay the grid)</small></label>

 <label title="Cut = dark areas intersected with the pattern, so the pattern's gaps stay as connecting material (self-bridging)."><input type="checkbox" id="carrier" style="width:auto"> Carrier mode
   <small>(threshold ∩ pattern → self-bridging)</small></label>
 <label title="Carrier mode: how dark a pixel must be to be cut.">Threshold <small id="thrv"></small></label>
 <input type="range" id="threshold" min="0.1" max="0.9" value="0.5" step="0.05"
   title="Carrier mode only: how dark a pixel must be to be cut (0.1 = almost everything, 0.9 = only the darkest areas).">
 <label title="Smallest cuttable detail = your tool/blade width.">Min feature / tool (mm)</label>
 <input type="number" id="min_feature_mm" value="0.5" min="0.05" step="0.05"
   title="Smallest detail the tool can cut, in mm (blade/kerf width). With a physical size set, the 'thin material %' is measured against this real size.">
 <label title="Alignment marks placed identically on every plate so colours line up on press.">Registration</label>
 <select id="registration"
   title="Alignment marks placed identically on every plate so colours line up: none / target / crosshair / corner."><option>none</option><option>target</option>
   <option>crosshair</option><option>corner</option></select>
 </fieldset>

 <fieldset class="grp"><legend>Layers &amp; Islands</legend>
 <div id="verdict" title="Cuttability verdict: green = nothing lost, amber = islands present but bridged on export, red = unbridgeable loss.">load an image…</div>
 <label title="One row per ink plate.">Layers (plates) <small>islands = pieces that fall out</small></label>
 <div id="layers" title="One row per ink plate: the first checkbox shows/hides the plate; the ◍ checkbox overlays just that plate's islands in red."></div>
 </fieldset>

 <fieldset class="grp"><legend>Export size</legend>
 <label title="Physical target size for a mural/poster — overrides the output paper.">Wall size <small>(physical target — overrides output paper)</small></label>
 <div class="row">
   <input type="number" id="wall_value" value="0" min="0" step="1" style="flex:2"
     title="Real-world size of the chosen dimension. 0 = off (use the output paper instead). The geometry is vector, so this is independent of the working resolution.">
   <select id="wall_unit" style="flex:1" title="Unit for the wall size (mm / cm / m)."></select>
   <select id="wall_dim" style="flex:1"
     title="Which dimension the wall size measures: width or height (the other follows the image aspect ratio).">
     <option value="width">width</option><option value="height">height</option></select>
 </div>
 <label title="Fit the design within a standard paper at real size (used only when no wall size is set).">Output size (paper)</label>
 <select id="out_size"
   title="Fit the whole design within this standard paper at real size. Ignored when a wall size is set."></select>
 <label title="Rotate the chosen paper(s) to landscape."><input type="checkbox" id="landscape" style="width:auto"> Landscape</label>
 <label title="Split the physical design across these sheets.">Split on paper (sheets)</label>
 <select id="paper"
   title="Split the physical design across sheets of this size (one set per colour plate). The sheet grid at the bottom shows how many."></select>
 <div class="row">
   <div><label title="Clear margin around the design, inset from the printable edge.">Clear margin (mm) <small>(0=off)</small></label>
     <input type="number" id="frame_mm" value="10" min="0" step="1"
       title="Clears this much margin around the design on every exported sheet (and single-file export), clipping any artwork out of it so the cutter won't cut it (10 = 1 cm). 0 turns it off."></div>
   <div><label title="Optional visible border line — leave 0 so the cutter has no frame to cut.">Frame line (mm) <small>(0=none)</small></label>
     <input type="number" id="frame_width_mm" value="0" min="0" step="0.1"
       title="Draw a visible border outline of this stroke width (mm). 0 = no line — the margin is just cleared, with no extra cut path for the cutter. Raise it only for a printed proof (the cutter WILL cut the line)."></div>
 </div>
 <label title="Output file format.">Export format</label>
 <select id="fmt"
   title="svg / pdf (vector), png (raster proof), dxf (laser/vinyl cutters), stl / blender (3-D plate)."></select>
 <button id="export" title="Render at full quality and download the file (or a .zip of sheets when splitting on paper).">Export ⤓</button>
 </fieldset>
</div>
<div id="stage">
 <div id="zoombar"><button id="zout" title="Zoom out">−</button><button id="zreset" title="Reset zoom">⤢</button><button id="zin" title="Zoom in">+</button></div>
 <div id="busy"><span class="spin"></span><span id="busytx">rendering…</span></div>
 <div id="holder"><em>upload a photo to start</em></div>
 <div id="sheets"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let imgId=null, timer=null, stimer=null, zoom=1;
const PATTERN_GROUPS=__PATTERN_GROUPS__, METHODS=__METHODS__, FORMATS=__FORMATS__, PAPERS=__PAPERS__;
const PRESETS=__PRESETS__, UNITS=__UNITS__;
for(const m of METHODS) method.add(new Option(m,m));
for(const [label,names] of PATTERN_GROUPS){           // grouped pattern dropdown
  const og=document.createElement('optgroup'); og.label=label;
  for(const n of names) og.appendChild(new Option(n,n));
  pattern.appendChild(og);
}
for(const f of FORMATS) fmt.add(new Option(f,f));
out_size.add(new Option("none (pixels)","none"));
paper.add(new Option("none","none"));
for(const p of PAPERS){ out_size.add(new Option(p,p)); paper.add(new Option(p,p)); }
preset.add(new Option("— none —",""));
for(const k in PRESETS) preset.add(new Option(PRESETS[k].label,k));
for(const u in UNITS) wall_unit.add(new Option(u,u));
wall_unit.value="cm";
const wallMm=()=>(+wall_value.value||0)*(UNITS[wall_unit.value]||1);

const params=()=>({id:imgId,method:method.value,pattern:pattern.value,cell:cell.value,
  contrast:contrast.value,gamma:gamma.value,invert:invert.checked,
  registration:registration.value,out_size:out_size.value,
  landscape:landscape.checked,min_feature_mm:min_feature_mm.value,
  carrier:carrier.checked,threshold:threshold.value,
  optimize:optimize.checked,angle:angle.value,max_duty:max_duty.value,
  wave_amplitude:wave_amplitude.value,wave_length:wave_length.value,
  wall_mm:wallMm(),wall_dim:wall_dim.value,group_blobs:group_blobs.checked,
  support:support.checked,support_width:support_width.value,debug:debug.checked,
  frame_mm:frame_mm.value,frame_width_mm:frame_width_mm.value});
function syncLabels(){
  cellv.textContent=cell.value;
  thrv.textContent=carrier.checked?threshold.value:'(carrier off)';
  mdv.textContent=max_duty.value;
  swv.textContent=support.checked?support_width.value+'px':'(support off)';
  linegrp.style.display=(pattern.value==='line_screen')?'':'none';
}
function debounce(){clearTimeout(timer);timer=setTimeout(render,180);}
function debounceSheets(){clearTimeout(stimer);stimer=setTimeout(loadSheets,200);}
// controls that change the preview (also refresh the sheet grid afterwards)
for(const el of [method,pattern,cell,contrast,gamma,invert,registration,
                 out_size,landscape,min_feature_mm,carrier,threshold,optimize,
                 angle,max_duty,wave_amplitude,wave_length,
                 wall_value,wall_unit,wall_dim,group_blobs,support,support_width,debug])
  el.addEventListener('input',()=>{syncLabels();debounce();});
// paper only affects panelisation → refresh the grid, no re-render
paper.addEventListener('input',debounceSheets);
preset.addEventListener('change',()=>{
  const p=PRESETS[preset.value]; if(!p)return;
  if(p.method!=null) method.value=p.method;
  if(p.pattern!=null) pattern.value=p.pattern;
  if(p.cell!=null) cell.value=p.cell;
  if(p.angle!=null) angle.value=p.angle;
  if(p.contrast!=null) contrast.value=p.contrast;
  max_duty.value=(p.max_duty!=null)?p.max_duty:1;
  wave_amplitude.value=p.wave_amplitude||0;
  wave_length.value=p.wave_length||0;
  syncLabels(); render();
});

$('file').addEventListener('change',async e=>{
  busytx.textContent='loading…'; busy.style.display='flex';
  const fd=new FormData();fd.append('file',e.target.files[0]);
  const r=await fetch('/api/upload',{method:'POST',body:fd});
  imgId=(await r.json()).id;render();});

function applyZoom(){ holder.style.zoom=zoom; }
zin.onclick =()=>{zoom=Math.min(8,zoom*1.25);applyZoom();};
zout.onclick=()=>{zoom=Math.max(.1,zoom/1.25);applyZoom();};
zreset.onclick=()=>{zoom=1;applyZoom();};
stage.addEventListener('wheel',e=>{ if(!imgId)return; e.preventDefault();
  zoom=Math.min(8,Math.max(.1, zoom*(e.deltaY<0?1.1:0.9))); applyZoom(); },{passive:false});

async function render(){
  if(!imgId)return;
  busytx.textContent='rendering preview…'; busy.style.display='flex';
  try{
    const r=await fetch('/api/preview?'+new URLSearchParams(params()));
    if(!r.ok){verdict.textContent='error';return;}
    const d=await r.json();
    holder.innerHTML=d.svg; applyZoom();
    const v=$('verdict');
    const thin=(d.thin*100).toFixed(0);
    const note=` <small>${d.scale_note}</small>`;
    if(d.status==='clean'){ v.className='ok';
      v.innerHTML=`✓ no islands lost · thin ${thin}%`+note; }
    else if(d.status==='bridge'){ v.className='warn';
      v.innerHTML=`● ${d.islands} island(s) — bridged on export · thin ${thin}%`+note; }
    else { v.className='bad';
      v.innerHTML=`✗ ${d.islands} island(s), some can't be bridged · thin ${thin}%`+note; }
    const L=$('layers');L.innerHTML='';
    const grp=n=>holder.querySelector('g[id="'+n+'"]');
    for(const ly of d.layers){
      const row=document.createElement('div'); row.className='lyrow';
      const islTgl=ly.islands?
        `<label class=isl title="overlay this plate's islands (red = pieces that fall out)">`+
        `<input type=checkbox class=islchk data-i="${ly.name}">◍ ${ly.islands}</label>`:'';
      row.innerHTML=`<input type=checkbox class=vis checked data-g="${ly.name}" `+
        `title="show/hide this plate">`+
        `<span class=sw style="background:rgb(${ly.color.join(',')})"></span>`+
        `${ly.name} <small>(${ly.count})</small>`+islTgl;
      L.appendChild(row);
      const ichk=row.querySelector('.islchk');
      row.querySelector('.vis').addEventListener('change',ev=>{
        const on=ev.target.checked, n=ev.target.dataset.g;
        const g=grp(n); if(g)g.style.display=on?'':'none';
        const ig=grp('isl__'+n);                 // islands follow the plate…
        if(ig)ig.style.display=(on&&ichk&&ichk.checked)?'':'none';
        const mg=grp('mesh__'+n); if(mg)mg.style.display=on?'':'none';});  // …and the mesh
      if(ichk)ichk.addEventListener('change',ev=>{ // …and toggle on their own
        const vis=row.querySelector('.vis').checked;
        const ig=grp('isl__'+ev.target.dataset.i);
        if(ig)ig.style.display=(ev.target.checked&&vis)?'':'none';});
    }
  } finally { busy.style.display='none'; }
  loadSheets();
}

$('export').addEventListener('click',async()=>{
  if(!imgId)return;
  const fd=new FormData();const p=params();   // includes out_size, landscape, …
  for(const k in p)fd.append(k,p[k]);
  fd.append('fmt',fmt.value);fd.append('optimize',optimize.checked);
  fd.append('max_side','1000');fd.append('paper',paper.value);
  busytx.textContent='exporting…'; busy.style.display='flex';
  $('export').disabled=true;
  try{
    const r=await fetch('/api/export',{method:'POST',body:fd});
    const blob=await r.blob();const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    const cd=r.headers.get('Content-Disposition')||'';
    a.download=(cd.match(/filename="(.+?)"/)||[,'stencil.'+fmt.value])[1];
    a.click();URL.revokeObjectURL(url);
  } finally { busy.style.display='none'; $('export').disabled=false; }
});
// ─── wall size → sheet grid (bottom container) ──────────────────────────────
async function loadSheets(){
  if(!imgId){sheets.style.display='none';return;}
  const q=new URLSearchParams({id:imgId,paper:paper.value,out_size:out_size.value,
    wall_mm:wallMm(),wall_dim:wall_dim.value,landscape:landscape.checked});
  try{
    const d=await (await fetch('/api/sheets?'+q)).json();
    if(!d.sized){sheets.style.display='none';return;}
    drawSheets(d);
  }catch(e){ sheets.style.display='none'; }
}
function drawSheets(d){
  const split=d.paper&&d.paper!=='none';
  const head=split
    ? `<b>${d.width_mm}×${d.height_mm} mm</b> · ${d.paper}${d.landscape?' ↔':''} · `+
      `${d.cols}×${d.rows} = ${d.sheets} sheet(s)`
    : `<b>${d.width_mm}×${d.height_mm} mm</b> · one piece <small>(pick a split paper)</small>`;
  const W=220, H=Math.max(36,Math.min(170, W*d.height_mm/d.width_mm));
  let cells='';
  for(let r=0;r<d.rows;r++)for(let c=0;c<d.cols;c++)
    cells+=`<div class=cell>${split?('r'+r+'c'+c):''}</div>`;
  sheets.innerHTML=`<div>${head}</div>`+
    `<div id=sheetgrid style="width:${W}px;height:${Math.round(H)}px;`+
    `grid-template-columns:repeat(${d.cols},1fr);`+
    `grid-template-rows:repeat(${d.rows},1fr)">${cells}</div>`;
  sheets.style.display='block';
}
syncLabels();
</script></body></html>
